<section class="panel linked-partner-panel" data-linked-partner-panel>
    <div class="panel-header">
        <div>
            <h2>Linked Master Partner</h2>
            <p>Connect this lifecycle workspace to the imported Master Partner Dashboard record.</p>
        </div>
    </div>
    <div class="linked-partner-layout">
        <div class="partner-link-controls">
            <label>
                Search partner
                <input type="search" data-partner-search placeholder="Search by partner name">
            </label>
            <div class="partner-search-results" data-partner-search-results></div>
        </div>
        <div class="partner-summary-card" data-linked-partner-summary>
            <p class="empty-state">No master partner linked yet. Search and select a partner to connect it.</p>
        </div>
    </div>
</section>
